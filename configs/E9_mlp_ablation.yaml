# E9: MLP architecture ablation. PLAN.md §6.E9 (STRETCH-main).
inherits: base.yaml

method: "mlp_ablation"
model:
  variant: "overlap_aware"
  enable_overlap_embed: true
  enable_overlap_md_loss: false      # isolate the embed-MLP architecture

paths:
  out_dir: "./results/E9_mlp_ablation"

sweep:
  mlp_hidden: [32, 64, 128, 256]
  mlp_depth:  [1, 2, 3]
  n_views:    [4]
  seeds:      [42]
