# E8: Weight-schedule ablation for similarity-weighted distillation.
# PLAN.md §6.E8 (STRETCH-main).
inherits: base.yaml

method: "weight_schedule_ablation"
model:
  variant: "overlap_aware"
  enable_overlap_embed: false        # isolate the loss-side weight schedule
  enable_overlap_md_loss: true

paths:
  out_dir: "./results/E8_weight_schedule"

sweep:
  weight_schedule: ["softmax_tau1", "softmax_tau2", "softmax_tau4", "softmax_tau8", "sigmoid", "inverse"]
  n_views: [4]
  seeds:   [42]
